<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <main class="container">
        <h1>My Todo List</h1>

        <form class="todo-form" onsubmit="return false;">
            <input
                type="text"
                class="todo-input"
                placeholder="What needs to be done?"
                aria-label="New todo"
            >
            <button type="submit" class="add-btn">Add</button>
        </form>

        <ul class="todo-list">
            <li class="todo-item">
                <label class="todo-label">
                    <input type="checkbox">
                    <span>Read chapter 4 of textbook</span>
                </label>
                <button class="delete-btn" aria-label="Delete todo">&times;</button>
            </li>
            <li class="todo-item">
                <label class="todo-label">
                    <input type="checkbox" checked>
                    <span class="done">Submit math assignment</span>
                </label>
                <button class="delete-btn" aria-label="Delete todo">&times;</button>
            </li>
            <li class="todo-item">
                <label class="todo-label">
                    <input type="checkbox">
                    <span>Prepare notes for study group</span>
                </label>
                <button class="delete-btn" aria-label="Delete todo">&times;</button>
            </li>
        </ul>

        <p class="empty-hint">Nothing here yet — add your first task above.</p>
    </main>

    <script src="app.js"></script>
</body>
</html>
